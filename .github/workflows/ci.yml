name: Verify website

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - name: Run the existing Cloudflare Pages build command
        run: npm run brand:prepare && npm run build --workspace=@void/website
      - run: npm run test:server
